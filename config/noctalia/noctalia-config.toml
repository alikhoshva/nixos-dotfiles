[bar.default]
background_opacity = 0.0
capsule = true
capsule_opacity = 0.4999999888241291
capsule_padding = 5.0
capsule_thickness = 0.99999998137354851
center = [ "workspaces" ]
color = "primary"
concave_edge_corners = false
end = [ "network", "volume", "battery", "notifications" ]
font_family = "DejaVu Sans"
font_weight = 700
icon_color = "primary"
margin_edge = 5
margin_ends = 5
padding = 5
panel_overlap = 0
shadow = false
start = [ "clock", "tray" ]
thickness = 30
widget_spacing = 5

[control_center]
hidden_tabs = [ "monitor", "power", "calendar", "notifications" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
enabled = false

[lockscreen]
fingerprint = false
tint_intensity = 0.099999997764825821
wallpaper = "/home/aleks/nixos-dotfiles/config/assets/lock.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 128.0
    box_width = 720.0
    cx = 960.0
    cy = 684.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 192.0
    box_width = 336.0
    cx = 960.0
    cy = 524.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0

[notification]
background_opacity = 0.74999998323619366

[osd.kinds]
media = false

[shell]
panel_anchor_bar = "default"

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    shadow = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/aleks/Media/Wallpapers"

    [wallpaper.default]
    path = "/home/aleks/Media/Wallpapers/wp11979303-4k-pixel-art-wallpapers.png"

    [wallpaper.last]
    path = "/home/aleks/Media/Wallpapers/wp11979303-4k-pixel-art-wallpapers.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/aleks/Media/Wallpapers/wp11979303-4k-pixel-art-wallpapers.png"

[widget.battery]
hide_when_plugged = true

[widget.network]
show_label = false
