# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Disable the command execution time module
[cmd_duration]
disabled = true

# Keep the directory length to 3 parent folders
[directory]
truncation_length = 3
style = "bold green"
truncate_to_repo = true

# Show only the Python symbol (hides version and venv name)
[python]
format = 'via [$symbol]($style) '

# Show only the Nix shell symbol (hides state and environment name)
[nix_shell]
format = 'via [$symbol]($style) '
