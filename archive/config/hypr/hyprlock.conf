background {
    monitor =
    path = $HOME/nixos-dotfiles/config/assets/lock.jpg
    
    # Heavy blur for that premium glass look
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.5000 # Darkened so the white text pops beautifully
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.2 
    dots_spacing = 0.15 
    dots_center = true
    
    # Subtle glassmorphism background for the input field
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(255, 255, 255)
    
    # Very clean: hide input until we start typing
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    
    position = 0, -100
    halign = center
    valign = center
}

# Big, bold, clean time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = Fira Semibold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Minimalist Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 22
    font_family = Fira Semibold
    position = 0, 30
    halign = center
    valign = center
}
